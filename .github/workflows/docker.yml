name: Build & Push Docker image (DISABLED)

# DISABLED. This workflow is inherited from upstream
# OceanProtocolEnterprise/market and was never rebranded: it publishes to
# `oceanenterprise/market:<version>` AND `:latest`, which is the UPSTREAM image.
# Pushing any v*.*.* tag from this fork would therefore overwrite the upstream
# release image with this fork's build.
#
# Two changes are disabled here:
#   1. the automatic `push: tags: v*.*.*` trigger has been removed, so a
#      release tag can no longer fire it, and
#   2. the job is gated with `if: false`, so it cannot be run manually either.
#
# To re-enable, in this order:
#   1. repoint the `tags:` in the build step below to this fork's own Docker
#      namespace,
#   2. set DOCKERHUB_USERNAME / DOCKERHUB_TOKEN to credentials for that
#      namespace,
#   3. remove the `if: false` below, and
#   4. only then restore the tag trigger if automatic publishing is wanted.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker tag version'
        required: true

permissions:
  contents: read

jobs:
  docker:
    # Remove this guard only after the image namespace and credentials above
    # have been repointed away from oceanenterprise/market.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate version format
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION (expected vMAJOR.MINOR.PATCH, e.g. v1.1.0)"
            exit 1
          fi

      - name: Debug refs
        run: |
          echo "event:     ${{ github.event_name }}"
          echo "ref:       ${{ github.ref }}"
          echo "ref_name:  ${{ github.ref_name }}"
          echo "version:   ${{ steps.ver.outputs.version }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (version + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            oceanenterprise/market:${{ steps.ver.outputs.version }}
            oceanenterprise/market:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
